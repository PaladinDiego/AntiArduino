; ESP32-C3 DevKitM-1 - RISC-V, USB-JTAG nativo
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, colorize, send_on_enter
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
debug_tool = esp-builtin
