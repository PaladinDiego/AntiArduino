; STM32 Blue Pill (STM32F103C8T6)
; Nota: muchos clones traen 128KB reales. Usa bluepill_f103c8_128k si aplica.
[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize, send_on_enter
upload_protocol = stlink
debug_tool = stlink
